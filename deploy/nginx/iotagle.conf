# Installed as /etc/nginx/sites-available/iotagle by deploy/bootstrap.sh.
# sites-enabled/* is included inside nginx's http{} block, so the map,
# limit_*_zone and upstream directives below are http-context.

# Per-client rate limiting. /read and /image make outbound fetches on our
# behalf (an open proxy, effectively), so they get budgets; plain pages don't.
# Loopback is exempt so the deploy health probe can never be throttled: an
# empty key disables limiting for that request.
map $remote_addr $iotagle_limit_key {
    127.0.0.1 "";
    ::1       "";
    default   $binary_remote_addr;
}

# A reader page with many images fans out into many /image hits, so /image
# gets a much larger budget than /read. Vintage browsers fetch images
# sequentially and slowly; these limits are far above real use.
limit_req_zone  $iotagle_limit_key zone=iotagle_read:10m   rate=20r/m;
limit_req_zone  $iotagle_limit_key zone=iotagle_image:10m  rate=120r/m;
limit_req_zone  $iotagle_limit_key zone=iotagle_search:10m rate=10r/m;
limit_conn_zone $iotagle_limit_key zone=iotagle_conn:10m;

upstream iotagle {
    # gunicorn binds to 127.0.0.1:8000; see deploy/gunicorn.conf.py for why
    # this is TCP rather than a unix socket.
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name iotagle.com;

    server_tokens off;
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 20s;
    keepalive_timeout 15s;

    limit_conn iotagle_conn 8;
    limit_conn_status 429;
    limit_req_status 429;

    # iotagle is HTTP-only by design. No HSTS, no HTTPS redirect.
    # Vintage browsers can't negotiate modern TLS; redirecting them to https://
    # would brick the whole site.
    #
    # The headers below are enforced by modern browsers and ignored by vintage
    # ones. The site has no JS or CSS and every image is served by /image, so
    # the CSP costs nothing. NOTE: any location that sets its own add_header
    # stops inheriting these; repeat them there if that ever happens.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'" always;

    access_log /var/log/nginx/iotagle.access.log;
    error_log  /var/log/nginx/iotagle.error.log warn;

    # Proxy settings shared by every proxied location. Locations must not set
    # their own proxy_set_header, or they lose all of these.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto http;
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;
    proxy_buffering on;
    proxy_buffers 8 16k;

    # Static files served directly by nginx; never proxied through gunicorn.
    location = /favicon.ico {
        alias /opt/iotagle/app/static/favicon.ico;
        access_log off;
        expires 7d;
    }

    location = /robots.txt {
        alias /opt/iotagle/app/static/robots.txt;
        access_log off;
    }

    location = /read {
        limit_except GET { deny all; }
        limit_req zone=iotagle_read burst=10 nodelay;
        proxy_pass http://iotagle;
    }

    location = /image {
        limit_except GET { deny all; }
        limit_req zone=iotagle_image burst=60 nodelay;
        proxy_pass http://iotagle;
    }

    location = /search {
        limit_except GET { deny all; }
        limit_req zone=iotagle_search burst=10 nodelay;
        proxy_pass http://iotagle;
    }

    location / {
        # The app only ever serves GET (HEAD is implied by limit_except GET).
        limit_except GET { deny all; }
        proxy_pass http://iotagle;
    }
}
