upstream iotagle {
    server unix:/run/iotagle/iotagle.sock fail_timeout=0;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name iotagle.com;

    server_tokens off;
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 20s;
    keepalive_timeout 15s;

    # iotagle is HTTP-only by design. No HSTS, no HTTPS redirect.
    # Vintage browsers can't negotiate modern TLS; redirecting them to https://
    # would brick the whole site.
    add_header X-Content-Type-Options nosniff always;

    access_log /var/log/nginx/iotagle.access.log;
    error_log  /var/log/nginx/iotagle.error.log warn;

    # Static files served directly by nginx; never proxied through gunicorn.
    location = /favicon.ico {
        alias /opt/iotagle/app/static/favicon.ico;
        access_log off;
        expires 7d;
    }

    location = /robots.txt {
        alias /opt/iotagle/app/static/robots.txt;
        access_log off;
    }

    location / {
        proxy_pass http://iotagle;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_buffering on;
        proxy_buffers 8 16k;
    }
}
