# CI: lint, test, and dependency audit on every push and PR, plus a weekly
# audit so newly published CVEs surface even when nothing is being pushed.
#
# Every `uses:` is pinned to a full commit SHA (tags are mutable); the
# trailing comment is the release it corresponds to. Dependabot keeps both
# up to date (.github/dependabot.yml).
name: ci

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 14 * * 1' # Mondays 14:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev deps
        run: 'pip install --require-hashes --only-binary=:all: -r requirements-dev.txt'

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install deps
        run: 'pip install --require-hashes --only-binary=:all: -r requirements-dev.txt'

      - name: pytest
        run: pytest -q

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pip-audit
        run: 'pip install --require-hashes --only-binary=:all: -r requirements-dev.txt'

      # --disable-pip: audit the fully pinned, hashed lock files as written
      # instead of resolving them again.
      - name: pip-audit (runtime)
        run: pip-audit --strict --require-hashes --disable-pip -r requirements.txt

      - name: pip-audit (dev tooling)
        run: pip-audit --strict --require-hashes --disable-pip -r requirements-dev.txt
