# Deploy: SSH into Lightsail, check out the target SHA, restart the service.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   LIGHTSAIL_HOST         iotagle.com (or the static IP)
#   LIGHTSAIL_USER         ubuntu
#   LIGHTSAIL_SSH_KEY      contents of the iotagle_deploy private key
#   LIGHTSAIL_KNOWN_HOSTS  output of `ssh-keyscan -t ed25519 <host>`
#
# Optional environment gate: set up a "production" GitHub environment with
# required reviewers to require manual approval on every deploy.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Wait for CI on this commit
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: test
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10
          # Limit the wait so a missing check doesn't hang the job forever.
          allowed-conclusions: success

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          install -m 600 /dev/stdin ~/.ssh/id_ed25519 <<<"${{ secrets.LIGHTSAIL_SSH_KEY }}"
          install -m 644 /dev/stdin ~/.ssh/known_hosts <<<"${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}"

      - name: Deploy
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          USER: ${{ secrets.LIGHTSAIL_USER }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Pipe the script in via stdin so the remote box doesn't need an
          # up-to-date checkout before it runs.
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "${USER}@${HOST}" \
              "bash -s -- ${SHA}" < deploy/remote_deploy.sh

      - name: Post-deploy health check
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
        run: |
          set -euo pipefail
          # Plain HTTP is intentional — iotagle doesn't speak HTTPS.
          for attempt in 1 2 3 4 5; do
            body="$(curl -fsS --max-time 5 "http://${HOST}/healthz" 2>&1 || true)"
            if [[ "${body}" == "ok" ]]; then
              echo "healthy after ${attempt} attempts"
              exit 0
            fi
            sleep 3
          done
          echo "health check failed; remote_deploy.sh should have rolled back"
          exit 1
