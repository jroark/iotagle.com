# Deploy: SSH to the Lightsail box as the restricted `deploy` user. Its key
# is pinned to /usr/local/sbin/iotagle-deploy (deploy/iotagle-deploy) by a
# forced command, so the only thing this workflow can do on the box is
# deploy a commit that is already on origin/main.
#
# Secrets (in the "production" environment, limited to the main branch):
#   LIGHTSAIL_HOST         iotagle.com (or the static IP)
#   LIGHTSAIL_USER         deploy
#   LIGHTSAIL_SSH_KEY      private half of the deploy key (ed25519). The
#                          public half is installed by
#                          `bootstrap.sh --deploy-pubkey`.
#   LIGHTSAIL_KNOWN_HOSTS  output of `ssh-keyscan -t ed25519 <host>`, checked
#                          against the instance's host key fingerprint
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Wait for CI on this commit
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          ref: ${{ github.sha }}
          check-regexp: '^(lint|test|audit)$'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10
          allowed-conclusions: success

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "${SSH_KEY}" | install -m 600 /dev/stdin ~/.ssh/id_ed25519
          printf '%s\n' "${KNOWN_HOSTS}" | install -m 644 /dev/stdin ~/.ssh/known_hosts

      - name: Deploy
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          DEPLOY_USER: ${{ secrets.LIGHTSAIL_USER }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The forced command on the box reads the SHA from
          # SSH_ORIGINAL_COMMAND and ignores anything else.
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
              -i ~/.ssh/id_ed25519 "${DEPLOY_USER}@${HOST}" "${SHA}"

      - name: Post-deploy health check
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
        run: |
          set -euo pipefail
          # Plain HTTP is intentional — iotagle doesn't speak HTTPS.
          for attempt in 1 2 3 4 5; do
            body="$(curl -fsS --max-time 5 "http://${HOST}/healthz" 2>&1 || true)"
            if [[ "${body}" == "ok" ]]; then
              echo "healthy after ${attempt} attempts"
              exit 0
            fi
            sleep 3
          done
          echo "health check failed; iotagle-deploy should have rolled back"
          exit 1

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
